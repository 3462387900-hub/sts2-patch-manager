function listRow(m){return `<div class="modrow ${ui.focus===m.id?'focus':''} ${ui.selected.has(m.id)?'selected':''} ${!m.enabled?'disabled':''}" data-mod="${m.id}" tabindex="0"><div>${selectButton(m)}</div><div class="modname">${art(m,'tile')}<div><strong>${esc(m.name)}</strong><small>${esc(m.author)} · ${m.cat}</small></div></div><div class="modversion mono">${esc(m.ver)}</div><div class="statecell">${toggleButton(m)}</div><div class="updcell">${modUpdate(m)}</div><div class="sourcecell">${modSource(m)}</div><div class="recentcell">${stamp(m.updated)}</div></div>`}
function poster(m){return `<div class="poster ${ui.focus===m.id?'focus':''} ${ui.selected.has(m.id)?'selected':''} ${!m.enabled?'disabled':''}" data-mod="${m.id}" tabindex="0">${art(m)}<div class="cardcheck">${selectButton(m)}</div><div class="topbadges">${m.latest?pill('可更新','blue'):''}</div><div class="bottomtag">${!m.ws?pill('未绑定','ghost'):''}</div><div class="postername"><div><strong title="${esc(m.name)}">${esc(m.name)}</strong><small>v${esc(m.ver)} · ${esc(m.author)}</small></div>${toggleButton(m)}</div></div>`}
function inspectorHTML(){const m=find(ui.focus);if(!m)return '';const ps=patchFor(m.id),section=ui.insTab;let body='';if(section==='overview')body=`<p>${esc(m.desc)}</p><dl class="kv"><dt>作者</dt><dd>${esc(m.author)}</dd><dt>类型</dt><dd>${m.cat}</dd><dt>当前版本</dt><dd class="mono">${esc(m.ver)}</dd><dt>可用版本</dt><dd class="mono">${m.latest?esc(m.latest):'未发现更新'}</dd><dt>文件大小</dt><dd>${isHosted?esc(m.sizeLabel||'未统计'):`${m.size} MB · 演示`}</dd></dl><div class="inspectsect"><h3>${isHosted?'实际本地路径':'本地路径（仅示例）'}</h3><div class="path">${esc(m.path||(`${s.gamePath}\\mods\\${m.id}`))}</div></div>`;
if(section==='source')body=`<div class="inspectsect"><h3>Steam Workshop / 尖塔补给站</h3>${m.ws?`<div class="inspectline">${I('layers')}<div><b class="mono">${m.ws}</b><small>${isHosted?'已关联来源':'已绑定 ID · 示例数据'}</small></div>${btn('解除','','small quiet',`data-act="unbind" data-id="${m.id}"`)}</div>`:'<p>尚未绑定 Workshop ID，无法从该来源识别更新。</p>'}${m.suggestion&&!m.ws?`<div class="note" style="padding:9px;color:var(--gold);background:var(--gold-bg);border-radius:8px;margin-bottom:10px">演示候选 ID：${m.suggestion} · 待人工确认</div>`:''}${btn('绑定 / 修改 Workshop ID','link','small',`data-act="bind" data-id="${m.id}"`)}</div><div class="inspectsect"><h3>GitHub 仓库</h3>${m.gh?`<div class="path">${esc(m.gh)}</div>`:'<p>没有关联 GitHub 仓库</p>'}${btn(m.gh?'修改 GitHub 地址':'关联 GitHub 仓库','branch','small',`data-act="bind-github" data-id="${m.id}"`)}</div>${btn('查找来源候选','search','small',`data-act="find-source" data-id="${m.id}"`)}`;
if(section==='deps'){const deps=m.deps.map(find).filter(Boolean),used=s.mods.filter(x=>x.deps.includes(m.id));body=`<div class="inspectsect"><h3>依赖的 MOD · ${deps.length}</h3>${deps.length?deps.map(d=>`<div class="inspectline">${art(d,'tile')}<div><b>${esc(d.name)}</b><small>${d.enabled?'已启用':'已禁用（可能影响加载）'}</small></div>${btn('查看','','small quiet',`data-act="inspect" data-id="${d.id}"`)}</div>`).join(''):'<p>没有记录前置依赖</p>'}</div><div class="inspectsect"><h3>依赖它的 MOD · ${used.length}</h3>${used.length?used.map(d=>`<div class="inspectline"><div><b>${esc(d.name)}</b><small>${d.enabled?'已启用':'已禁用'}</small></div></div>`).join(''):'<p>没有其他 MOD 依赖它</p>'}</div>`}
if(section==='patch')body=`<div class="inspectsect"><h3>关联补丁 · ${ps.length}</h3>${ps.length?ps.map(p=>`<div class="inspectline">${I('wrench')}<div><b>${esc(p.name)}</b><small>${patchStatus(p).why}</small></div>${pill(patchStatus(p).text,patchStatus(p).type==='review'?'warn':patchStatus(p).type==='ok'?'ok':'')}</div>`).join(''):'<p>没有关联的兼容性修复补丁</p>'}</div>${btn('在修复中心查看','arrow','small',`data-page="repair"`)}`;
if(section==='update')body=isHosted?(m.latest?`<div class="versionflow">${esc(m.ver)} ${I('arrow')} <b>${esc(m.latest)}</b></div><p>${esc(m.updateStatus||'已缓存更新结果')}。当前阶段只展示状态，不下载或覆盖文件。</p>`:`<div class="empty">${I('info')}<h3>${esc(m.updateStatus||'尚未检查更新')}</h3><p>ATLAS 第一阶段不会主动发起网络检查。</p></div>`):(m.latest?`<div class="versionflow">${m.ver} ${I('arrow')} <b>${m.latest}</b></div><p>发现一个模拟的可用版本，更新前请检查依赖与关联补丁。</p>${btn('模拟更新到 '+m.latest,'refresh','gold',`data-act="update-one" data-id="${m.id}"`)}`:'<div class="empty">'+I('check')+'<h3>已是演示最新版本</h3></div>');
return `<aside class="inspector ${s.inspectorPin?'pinned':''}" id="inspector"><div class="inspectscroll"><div class="inspecthero art" style="--h:${hash(m.name)%360}"><span class="rune">${esc(m.name.substring(0,2))}</span><div class="rightbuttons"><button class="iconbtn ${s.inspectorPin?'on':''}" data-act="pin" title="${s.inspectorPin?'取消固定':'固定检查器'}">${I('pin','sm')}</button><button class="iconbtn" data-act="close-inspector" title="关闭">${I('x','sm')}</button></div></div><div class="inspecthead"><h2>${esc(m.name)}</h2><div class="subline">${esc(m.author)} / ${esc(m.cat)} / v${esc(m.ver)}</div></div><div class="inspectstate">${toggleButton(m)}<div class="spacer"><strong>${m.enabled?'已启用':'已禁用'}</strong><div class="fine">${m.enabled?'将在游戏加载时生效':'游戏启动时不加载'}</div></div>${m.ws?'':pill('未绑定','ghost')}</div><div class="inspectactions">${m.latest?btn('更新版本','up','gold small',`data-act="update-one" data-id="${m.id}"`):''}${btn('识别来源','search','small',`data-act="find-source" data-id="${m.id}"`)}${btn('', 'ellipsis','small quiet',`data-act="more-mod" data-id="${m.id}"`)}</div><div class="inspecttabs">${[['overview','概览'],['source','来源'],['deps','依赖'],['patch','补丁'],['update','更新']].map(([id,l])=>`<button class="${section===id?'active':''}" data-instab="${id}">${l}${id==='patch'&&ps.length?' '+ps.length:''}</button>`).join('')}</div><div class="inspectbody">${body}</div></div></aside>`}
function chips(){let out=[];if(ui.status!=='all')out.push(['status',ui.status==='on'?'已启用':'已禁用']);if(ui.updates!=='all')out.push(['updates',ui.updates==='has'?'可更新':'已最新']);if(ui.source!=='all')out.push(['source',ui.source==='workshop'?'Workshop':ui.source==='github'?'GitHub':'仅本地']);if(ui.cat!=='all')out.push(['cat',ui.cat]);if(ui.unbound)out.push(['unbound','未绑定 ID']);return out.map(([id,name])=>`<button class="filterchip" data-removefilter="${id}">${esc(name)} ${I('x','sm')}</button>`).join('')}
function modShell(){return `<div class="mods-page"><div class="mods-intro"><div class="mods-title"><h1>模组库</h1><small>已安装 ${s.mods.length} · 已启用 ${s.mods.filter(m=>m.enabled).length}</small></div><div class="mods-controls"><button class="iconbtn ${s.railOpen?'on':''}" data-act="rail" title="筛选边栏">${I('filter')}</button><label class="searchfield">${I('search','sm')}<input id="modquery" autocomplete="off" value="${esc(ui.query)}" placeholder="搜索名称、ID 或作者…" aria-label="搜索模组"></label><select class="select" id="modsort" aria-label="排序"><option value="name">名称排序</option><option value="update">更新优先</option><option value="enabled">启用优先</option><option value="time">最近更新</option></select>${isHosted?btn('刷新清单','refresh','small',`data-act="refresh-snapshot"`):btn('检测更新','refresh','small',`data-act="check-mods"`)}${isHosted?'<span class="fine">只读 Beta</span>':btn('导入 MOD','down','small gold',`data-act="import"`)}</div></div><div class="mods-content ${s.railOpen?'':'rail-closed'}" id="modlayout"><aside class="filterrail" id="filterrail">${filterPanel()}</aside><section class="workarea ${s.inspectorPin&&ui.focus?'pinroom':''}" id="workarea"><div class="worktop"><div class="active-filters" id="filterchips">${chips()||`<span class="smallnote">点击 MOD 查看详情，勾选后进行批量管理</span>`}</div><span class="summary" id="modcount"></span><button class="btn quiet small" data-act="select-all" title="全选或取消选择当前筛选结果">全选</button><div class="seg"><button data-view="library" class="${s.view==='library'?'active':''}" title="游戏库视图">${I('grid','sm')} 库</button><button data-view="list" class="${s.view==='list'?'active':''}" title="紧凑列表">${I('list','sm')} 列表</button></div></div><div class="listheader" id="listheader"><button class="check" data-act="select-all" title="全选当前筛选结果" aria-label="全选当前筛选结果">${I('check','sm')}</button><button data-act="sort-name">名称</button><span>版本</span><span class="statehead">启用</span><span>更新</span><span class="sourcehead">来源</span><span class="recenthead">更新时间</span></div><div class="modscroll" id="modscroll"><div id="moditems"></div></div><div class="bulkdock" id="bulkdock"></div>${ui.focus&&find(ui.focus)?inspectorHTML():''}</section></div></div>`}
function modsPage(){return modShell()}
function postModRender(){let select=$('#modsort');if(select)select.value=ui.sort;renderModItems();renderDock()}
function renderModItems(){if(s.page!=='mods'||!$('#moditems'))return;const a=filtered();$('#moditems').className=s.view==='library'?'library':'';$('#moditems').innerHTML=a.length?a.map(s.view==='library'?poster:listRow).join(''):`<div class="empty">${I('search')}<h3>没有符合条件的 MOD</h3><p>试试清除筛选，或改用其他关键词。</p>${btn('清除筛选','x','small',`data-act="reset-filters"`)}</div>`;$('#listheader').hidden=s.view==='library';$('#modcount').textContent=`${a.length} / ${s.mods.length} 项`;$('#filterchips').innerHTML=chips()||'<span class="smallnote">点击 MOD 查看详情，勾选后进行批量管理</span>';}
function renderDock(){const el=$('#bulkdock');if(!el)return;const n=ui.selected.size;el.classList.toggle('visible',n>0);el.innerHTML=n?(isHosted?`<span class="count">已选 ${n}</span><span class="sep"></span><span class="fine">第一阶段只读 · 批量操作将在后续阶段接入</span>${btn('取消选择','x','small quiet',`data-act="clear-selection"`)}`:`<span class="count">已选 ${n}</span><span class="sep"></span>${btn('启用','check','small',`data-act="bulk-enable"`)}${btn('禁用','x','small',`data-act="bulk-disable"`)}${btn('更新','refresh','small',`data-act="bulk-update"`)}${btn('识别来源','search','small',`data-act="bulk-find"`)}${btn('绑定 ID','link','small',`data-act="bulk-bind"`)}<span class="sep"></span>${btn('删除','trash','small danger',`data-act="bulk-delete"`)}${btn('取消选择','x','small quiet',`data-act="clear-selection"`)}`):''}
function refreshMods(keepScroll=true){if(s.page!=='mods'){render();return}const scroll=$('#modscroll')?.scrollTop||0;render();if(keepScroll&&$('#modscroll'))$('#modscroll').scrollTop=scroll}
function inspect(id){if(!find(id))return;ui.focus=id;ui.insTab='overview';if(s.page!=='mods')go('mods');else refreshMods()}
function clearInspector(){ui.focus=null;s.inspectorPin=false;persist();refreshMods()}
function patchPage(){return ''}
function repairPage(){const statuses=s.patches.map(patchStatus),n=t=>statuses.filter(x=>x.type===t).length;if(isHosted)return `<div class="repair-page"><div class="repairbar"><h1>修复工作台</h1><div class="seg">${[['all','全部',s.patches.length],['review','需复查',n('review')],['ok','已安装',n('ok')],['off','已停用 / 不适用',n('off')]].map(([k,l,v])=>`<button class="${ui.patchFilter===k?'active':''}" data-pfilter="${k}">${l} <span class="fine">${v}</span></button>`).join('')}</div><span class="spacer"></span><label class="searchfield">${I('search','sm')} <input id="patchsearch" value="${esc(ui.patchSearch)}" placeholder="搜索补丁或关联 MOD"></label></div><div class="ruleinfo">${I('info','sm')} <span><b>真实扫描结果</b> 来自管理器现有补丁适配检查。ATLAS 当前只展示状态和依据，不执行补丁启停、安装或退役。</span></div><div class="patchscroll" id="patchresults"></div></div>`;return `<div class="repair-page"><div class="repairbar"><h1>修复工作台</h1><div class="seg">${[['all','全部',s.patches.length],['review','待复查',n('review')],['ok','文件正常',n('ok')],['off','已停用',n('off')]].map(([k,l,v])=>`<button class="${ui.patchFilter===k?'active':''}" data-pfilter="${k}">${l} <span class="fine">${v}</span></button>`).join('')}</div><span class="spacer"></span><label class="searchfield">${I('search','sm')} <input id="patchsearch" value="${esc(ui.patchSearch)}" placeholder="搜索补丁或关联 MOD"></label>${btn('模拟文件检查','shield','small',`data-act="scan-patches"`)}${btn('添加补丁','down','small',`data-act="add-patch"`)}</div><div class="ruleinfo">${I('info','sm')} <span><b>文件健康</b> 只表示版本与文件的静态检查；<b>运行验证</b> 需要玩家实际进入游戏后单独记录。二者不可混为一谈。</span></div><div class="patchscroll" id="patchresults"></div></div>`}
function renderPatchResults(){const host=$('#patchresults');if(!host)return;const q=ui.patchSearch.trim().toLowerCase(),items=s.patches.filter(p=>(ui.patchFilter==='all'||patchStatus(p).type===ui.patchFilter)&&(!q||p.name.toLowerCase().includes(q)||String(find(p.modId)?.name||'已删除').toLowerCase().includes(q)));host.innerHTML=`<table class="patchtable"><thead><tr><th style="width:22%">修复补丁</th><th style="width:17%">关联 MOD</th><th style="width:9%">启用</th><th style="width:12%">文件健康</th><th style="width:16%">适配版本</th><th style="width:13%">运行验证</th><th>操作</th></tr></thead><tbody>${items.map(p=>{const m=find(p.modId),status=patchStatus(p),open=ui.patchFocus===p.id;return `<tr data-patch="${p.id}" style="${open?'background:var(--surface2)':''}"><td><strong>${esc(p.name)}</strong><small>${esc(p.version)} · ${esc(p.reason||status.why)}</small></td><td>${m?`<b>${esc(m.name)}</b><small>v${esc(m.ver)}</small>`:`<span style="color:var(--red)">目标 MOD 已移除</span>`}</td><td><button class="toggle ${p.enabled&&m?.enabled?'on':''}" role="switch" aria-checked="${!!(p.enabled&&m?.enabled)}" data-act="toggle-patch" data-id="${p.id}" aria-label="切换补丁"></button></td><td>${pill(status.text,status.type==='review'?'warn':status.type==='ok'?'ok':'')}</td><td class="mono">${esc(p.bound)}<small>当前适配目标</small></td><td>${pill(({verified:'已记录通过',failed:'已记录失败',untested:'未测试',stale:'记录已过期'})[p.runtime]||'未测试',p.runtime==='verified'?'ok':p.runtime==='failed'?'bad':p.runtime==='stale'?'warn':'')}</td><td><div style="display:flex;align-items:center;gap:4px">${btn('复查','refresh','small quiet',`data-act="check-patch" data-id="${p.id}"`)}${btn(open?'收起':'详情','arrow','small',`data-act="expand-patch" data-id="${p.id}"`)}</div></td></tr>${open?`<tr class="detailrow"><td colspan="7"><div class="patchdetail"><section><h3>检查依据</h3><p>${esc(p.checked||'尚未检查')}。当前文件标记为 ${p.file==='ok'?'通过':p.file==='warn'?'有提示':'未检查'}。文件状态不等于兼容性测试结论。</p>${btn('模拟重新检查','refresh','small',`data-act="check-patch" data-id="${p.id}"`)}</section><section><h3>适配信息</h3><p>声明适配版本：${esc(p.bound)}<br>当前 MOD 版本：${esc(m?.ver||'已移除')}<br>${esc(status.why)}</p>${m?btn('人工确认版本范围','check','small',`data-act="confirm-patch-range" data-id="${p.id}"`):''}</section><section><h3>运行验证（人工记录）</h3><p>通过游戏内实际测试后，才应记录为通过。更新 MOD 后旧记录将标记为过期。</p><div style="display:flex;gap:6px;flex-wrap:wrap">${btn('记录通过','check','small',`data-act="record-runtime" data-id="${p.id}" data-result="verified"`)}${btn('记录失败','x','small',`data-act="record-runtime" data-id="${p.id}" data-result="failed"`)}</div></section></div></td></tr>`:''}`}).join('')||'<tr><td colspan="7"><div class="empty">没有符合条件的补丁。</div></td></tr>'}</tbody></table>`}
function postRepairRender(){renderPatchResults()}

→ ${m.latest}</span>${btn('更新','up','small',`data-act="update-one" data-id="${m.id}"`)}</div>`).join(''):`<div class="empty">${I('check')}<h3>所有演示 MOD 均已更新</h3><p>更新检测仅在点击后执行；不会访问真实服务器。</p></div>`}<div style="border-top:1px solid var(--line);margin:24px 3px;padding:17px 3px"><div class="sectionheading"><h2>管理器本体</h2></div><p class="smallnote">ATLAS UI 概念原型 · 不提供真实程序更新。</p>${btn('模拟检查管理器版本','refresh','small',`data-act="check-app"`)}</div></div></section><aside class="updateright">${focused&&focused.latest?`${art(focused,'tile')}<h2>${esc(focused.name)}</h2><div class="fine">${esc(focused.author)} · ${esc(focused.cat)}</div><div class="versionflow"><span>${esc(focused.ver)}</span>${I('arrow')}<b>${esc(focused.latest)}</b></div><div class="risknote ${risk?'':'safe'}">${I(risk?'warning':'shield','sm')} ${risk?`更新后 ${risk} 个关联补丁可能需要重新确认适配。`:pcount?'关联补丁当前未启用，请自行检查兼容性。':'没有关联补丁需要处理。'}</div><div class="sectionheading" style="margin-top:25px"><h2>本次版本信息</h2></div><ul class="changelog"><li>演示更新：改善内容兼容性</li><li>演示更新：调整用户界面与错误提示</li><li>演示更新：常规性能优化</li></ul><p>这些版本说明是占位数据，不代表 MOD 作者真实发布内容。</p>${btn('模拟更新','up','gold',`data-act="update-one" data-id="${focused.id}"`)} ${btn('查看模组','arrow','',`data-act="inspect" data-id="${focused.id}"`)}`:`<div class="empty">${I('check')}<h3>暂无可查看的更新</h3></div>`}</aside></div>`}

function toggleEnabled(id,on){const m=find(id);if(!m)return 0;const val=typeof on==='boolean'?on:!m.enabled;if(m.enabled===val)return 0;m.enabled=val;let n=0;if(!val)patchFor(id).forEach(p=>{if(p.enabled){p.enabled=false;p.reason='关联 MOD 已禁用，自动停用';n++}});else patchFor(id).forEach(p=>{if(p.reason.includes('关联 MOD 已禁用'))p.reason='关联 MOD 已恢复，可手动重新启用'});activity(`${val?'启用':'禁用'}「${m.name}」${n?'；自动停用 '+n+' 个补丁':''}`);return n}
function updateOne(id){const m=find(id);if(!m||!m.latest){toast('当前没有可用的演示更新','warn');return}const old=m.ver;m.ver=m.latest;m.latest=null;m.updated=Date.now();const patches=patchFor(id);patches.forEach(p=>{if(p.runtime==='verified')p.runtime='stale';p.checked=`更新前绑定 ${p.bound}；现为 ${m.ver}，建议复查`});activity(`模拟更新「${m.name}」 ${old} → ${m.ver}`);toast(`已模拟更新「${m.name}」${patches.length?'；请关注关联补丁':''}`,'ok');if(s.page==='mods')refreshMods();else render()}

let ticker=null;function startTimer(){if(ticker)return;ticker=setInterval(()=>{let active=false,changed=false;for(const t of s.downloads){if(t.state==='queued'){t.state='downloading';active=true;changed=true}if(t.state==='downloading'){active=true;const r=catalog.find(r=>r.id===t.rid);t.progress=Math.min(100,t.progress+(r?.src==='github'?4:7)+Math.round(Math.random()*6));changed=true;if(t.progress>=100){t.progress=100;t.state='ready';active=false;toast(`${t.name} 模拟下载完成，可手动安装`,'ok');activity(`完成模拟下载：「${t.name}」`)}}}if(changed){persist();if(s.page==='download'){$('#downloadqueue').innerHTML=queueHTML();/* do not destroy resource scroll position */}}if(!s.downloads.some(t=>['queued','downloading'].includes(t.state))){clearInterval(ticker);ticker=null}},420)}
function taskAction(act,id){const t=s.downloads.find(x=>x.id===id);if(!t)return;if(act==='pause-task'&&['queued','downloading'].includes(t.state))t.state='paused';if(act==='resume-task'&&t.state==='paused'){t.state='queued';startTimer()}if(act==='cancel-task'){t.state='cancelled';s.downloads=s.downloads.filter(x=>x.id!==id)}if(act==='install-task'&&t.state==='ready'){const r=catalog.find(r=>r.id===t.rid);if(r&&!installedResource(r)){s.mods.unshift({id:'download-'+Date.now(),name:r.name,author:r.author,cat:r.cat,ver:r.version,latest:null,enabled:false,ws:'',gh:'',size:String(r.size),updated:Date.now(),desc:r.desc,deps:[],suggestion:null});s.history.unshift({name:r.name,at:Date.now(),source:r.src,state:'installed'});activity(`将「${r.name}」安装到演示模组库（默认禁用）`)}t.state='installed';s.downloads=s.downloads.filter(x=>x.id!==id);toast(`已模拟安装「${t.name}」；默认禁用`,'ok')}persist();chrome();if(s.page==='download')rerenderCatalog();else render()}

function openMenu(anchor,id){closeMenu();const m=find(id);if(!m)return;const el=document.createElement('div');el.className='popupmenu';el.innerHTML=`<button data-act="inspect" data-id="${id}">${I('info')}查看模组详情</button><button data-act="find-source" data-id="${id}">${I('search')}识别 Workshop 来源</button><button data-act="bind" data-id="${id}">${I('link')}绑定 / 修改 Workshop ID</button><button data-act="update-one" data-id="${id}" ${m.latest?'':'disabled'}>${I('up')}更新模组</button><hr><button data-act="delete-one" data-id="${id}" class="danger">${I('trash')}从演示库删除</button>`;$('#popup').append(el);const r=anchor.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;el.style.left=Math.max(8,Math.min(window.innerWidth-w-8,r.left))+'px';el.style.top=Math.max(8,Math.min(window.innerHeight-h-8,r.bottom+5))+'px';ui.menu=id}
function closeDialog(){ui.modal=null;$('#modalroot').innerHTML=''}
function openDialog(type,params={}){closeMenu();ui.modal={type,...params};let title='',content='',footer='',wide=false;const ids=params.ids||[],mods=ids.map(find).filter(Boolean);const foot=(label='确认',danger=false)=>`<div class="foot">${btn('取消','','',`data-act="close-modal"`)}${btn(label,danger?'trash':'check',danger?'danger':'gold',`data-act="confirm-modal"`)}</div>`;
if(type==='delete'){title=`移除 ${mods.length} 个演示 MOD？`;content=`<p>从本地演示数据中移除以下模组，关联修复补丁会自动停用。<b>不会删除真实文件。</b></p><div class="path">${mods.slice(0,15).map(m=>esc(m.name)).join(' · ')}</div>`;footer=foot('确认移除',true)}
if(type==='bind'){title=mods.length>1?`批量绑定 Workshop ID · ${mods.length} 项`:`绑定 Workshop ID`;content=`<p>仅接受数字 ID。候选 ID 是模拟数据，需要确认后才保存。留空的项目保持不变。</p><div style="max-height:320px;overflow:auto">${mods.map(m=>`<label>${esc(m.name)} <small class="muted">${m.suggestion?'· 存在演示候选 '+m.suggestion:''}</small><input data-bindid="${m.id}" value="${esc(m.ws||'')}" placeholder="输入 Workshop ID"></label>`).join('')}</div><div class="note">本原型不连接真实 Steam 创意工坊；输入 ID 不会执行在线验证。</div>`;footer=foot('保存演示绑定')}
if(type==='source'){const m=mods[0];if(!m)return;title='来源候选确认';content=`<p>已按名称生成一次离线模拟匹配结果。正式版需要使用云端来源索引，并展示匹配证据。</p><div class="candidate"><strong>${esc(m.name)}</strong><small>${m.suggestion?`候选 Workshop ID：${m.suggestion}（演示值，未经核实）`:'未找到候选，可手动绑定'}</small></div><div class="note">不会自动将候选 ID 写入 MOD。请只在确认来源真实匹配后绑定。</div>`;footer=`<div class="foot">${btn('关闭','','',`data-act="close-modal"`)}${btn('手动绑定','link','gold',`data-act="source-to-bind" data-id="${m.id}"`)}</div>`}
if(type==='github'){const m=find(params.id);if(!m)return;title='关联 GitHub 仓库';content=`<p>输入仓库的 owner/repo，例如示例作者/示例仓库。原型只保存文字，不会访问 GitHub API。</p><label>仓库地址（owner/repo）<input id="ghInput" value="${esc(m.gh||'')}" placeholder="owner/repository"></label>`;footer=foot('保存仓库关联')}
if(type==='import'){title='模拟导入本地 MOD';content='<p>添加一条演示记录，不会读取或安装 ZIP、DLL 和目录。</p><label>MOD 名称<input id="importName" placeholder="例如：我的本地模组" maxlength="70"></label><label>版本号<input id="importVersion" value="1.0.0" maxlength="20"></label>';footer=foot('添加模组')}
if(type==='path'){title='演示游戏目录';content=`<p>仅修改原型显示的路径，不扫描磁盘。</p><label>目录路径<input id="pathInput" value="${esc(s.gamePath)}"></label>`;footer=foot('保存显示路径')}
if(type==='reset'){title='重置演示原型';content='<p>会清空在本 HTML 中操作产生的状态、来源绑定、模拟下载历史和设置，并恢复初始数据。</p>';footer=foot('确认重置',true)}
if(type==='patch-range'){const p=s.patches.find(x=>x.id===params.id),m=p&&find(p.modId);if(!m)return;title='人工确认补丁适配范围';content=`<p>将补丁「${esc(p.name)}」的演示适配目标从 ${esc(p.bound)} 改为 ${esc(m.ver)}。</p><div class="note">仅更新用户声明的适配范围，不代表已通过实际游戏测试。如果文件检查仍有提示，健康状态不会变为正常。</div>`;footer=foot('记录版本适配')}
if(type==='runtime'){const p=s.patches.find(x=>x.id===params.id);if(!p)return;title=params.result==='verified'?'记录游戏内验证通过':'记录游戏内验证失败';content=`<p>请仅在实际游戏内测试过补丁「${esc(p.name)}」后使用此入口。</p><div class="note">此处仍只是离线原型记录，不会自动运行游戏、检测崩溃或证明补丁兼容。</div>`;footer=foot('保存人工记录')}
if(type==='add-patch'){title='添加演示补丁';content=`<p>创建一条修复补丁演示记录，默认停用。</p><label>补丁名称<input id="newPatchName" placeholder="例如：文字换行兼容"></label><label>关联模组<select id="newPatchMod" class="select" style="width:100%;max-width:none;margin-top:5px">${s.mods.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>`;footer=foot('添加演示补丁')}
if(type==='resource'){const r=catalog.find(x=>x.id===params.id);if(!r)return;title=r.name;content=`${art(r)}<p style="margin-top:12px">${esc(r.desc)}</p><dl class="kv"><dt>作者</dt><dd>${esc(r.author)}</dd><dt>版本</dt><dd>v${r.version}</dd><dt>类型</dt><dd>${r.cat}</dd><dt>来源</dt><dd>${r.src==='github'?'GitHub':'尖塔补给站'}（模拟）</dd><dt>大小</dt><dd>${r.size} MB（模拟）</dd></dl><div class="note">该资源仅为界面测试数据，不代表真实创意工坊商品。</div>`;footer=`<div class="foot">${btn('关闭','','',`data-act="close-modal"`)}${btn('添加到下载队列','down','gold',`data-act="download-one" data-id="${r.id}"`)}</div>`}
$('#modalroot').innerHTML=`<div class="overlay" id="modaloverlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${content}${footer}</div></div>`;$('#modalroot input')?.focus()}
function submitModal(){const m=ui.modal;if(!m)return;const type=m.type;
if(type==='delete'){const ids=m.ids||[],removed=ids.map(find).filter(Boolean),set=new Set(ids);for(const p of s.patches)if(set.has(p.modId)){p.enabled=false;p.reason='关联 MOD 已删除，补丁自动停用'}s.mods=s.mods.filter(x=>!set.has(x.id));ids.forEach(x=>ui.selected.delete(x));if(set.has(ui.focus))ui.focus=null;activity(`从演示模组库移除 ${removed.length} 个项目`);toast(`已移除 ${removed.length} 项，关联补丁已检查`,'ok')}
if(type==='bind'){let bad=false,changed=0;const inputs=$$('[data-bindid]');for(const x of inputs){const v=x.value.trim();if(v&&!/^\d{6,18}$/.test(v)){x.focus();toast('Workshop ID 请填写 6～18 位数字','warn');bad=true;break}}if(bad)return;inputs.forEach(x=>{const mod=find(x.dataset.bindid),v=x.value.trim();if(mod&&v!==mod.ws&&v){mod.ws=v;mod.suggestion=null;changed++}});activity(`手动保存 ${changed} 个 Workshop ID（未在线核实）`);toast(changed?`已保存 ${changed} 项演示绑定`:'没有需要修改的来源 ID')}
if(type==='github'){const mod=find(m.id),value=$('#ghInput')?.value.trim();if(!mod)return;if(value&&!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(value)){toast('请使用 owner/repository 格式','warn');return}mod.gh=value;activity(`修改「${mod.name}」的 GitHub 仓库文字关联`);toast('已保存演示 GitHub 仓库关联','ok')}
if(type==='import'){const name=$('#importName')?.value.trim(),ver=$('#importVersion')?.value.trim()||'1.0.0';if(!name){toast('请先填写 MOD 名称','warn');return}const id='local-'+Date.now();s.mods.unshift({id,name,cat:'工具',author:'本地导入',ver,latest:null,enabled:false,ws:'',gh:'',size:'—',updated:Date.now(),desc:'本地手工添加的演示模组。',deps:[],suggestion:null});ui.focus=id;activity(`新增本地演示模组「${name}」`);s.page='mods';toast('已添加演示模组','ok')}
if(type==='path'){const v=$('#pathInput')?.value.trim();if(!v){toast('路径不能为空','warn');return}s.gamePath=v;activity('修改演示游戏目录');toast('演示目录文字已更新')}
if(type==='reset'){Object.assign(s,{...defaults,mods:makeMods(),patches:[],downloads:[],history:[],activities:[],page:'overview'});s.patches=makePatches(s.mods);ui.focus=null;ui.selected.clear();Object.assign(ui,{query:'',status:'all',updates:'all',source:'all',cat:'all',unbound:false,patchSearch:'',downloadQuery:''});if(ticker){clearInterval(ticker);ticker=null}toast('演示数据已恢复','ok')}
if(type==='patch-range'){const p=s.patches.find(x=>x.id===m.id),mod=p&&find(p.modId);if(p&&mod){p.bound=mod.ver;p.checked='玩家人工记录演示适配范围（未实际验证）';activity(`记录补丁适配范围「${p.name}」 v${mod.ver}`);toast('已更新演示适配范围；运行验证仍独立','ok')}}
if(type==='runtime'){const p=s.patches.find(x=>x.id===m.id);if(p){p.runtime=m.result;p.checked='玩家手动记录运行验证（演示）';activity(`记录「${p.name}」游戏内测试为${m.result==='verified'?'通过':'失败'}`);toast('已保存人工演示记录','ok')}}
if(type==='add-patch'){const name=$('#newPatchName')?.value.trim(),id=$('#newPatchMod')?.value;const mod=find(id);if(!name||!mod){toast('请填写补丁名称并选择关联 MOD','warn');return}s.patches.unshift({id:'patch-'+Date.now(),name,modId:id,version:'r1',enabled:false,file:'ok',runtime:'untested',bound:mod.ver,reason:'新补丁默认停用',checked:'未执行检查'});activity(`添加补丁演示记录「${name}」`);toast('演示补丁已添加，默认停用','ok')}
persist();closeDialog();render()}
function sendHostMessage(type,payload={}){if(isHosted)window.chrome.webview.postMessage({type,...payload})}
function doAction(act,id,el,e){if(isHosted){if(act==='switch-wpf'){sendHostMessage('switchToWpf');return}if(act==='game-menu'||act==='path'){sendHostMessage('chooseGameFolder');return}if(act==='launch'){sendHostMessage('launchGame');return}if(act==='refresh-snapshot'){sendHostMessage('refreshSnapshot');toast('正在刷新真实本地状态');return}if(hostedBlockedActions.has(act)){toast('ATLAS 第一阶段为只读模式，该操作将在后续阶段接入。','warn');return}}switch(act){
case 'launch':toast(`模拟启动请求：${s.mods.filter(m=>m.enabled).length} 个 MOD 已启用；没有启动真实游戏`,'ok');activity('模拟启动游戏');break;
case 'game-menu':openDialog('path');break;
case 'theme':s.theme={obsidian:'midnight',midnight:'parchment',parchment:'obsidian'}[s.theme];persist();render();toast('主题已切换');break;
case 'rail':case 'close-rail':s.railOpen=act==='rail'?!s.railOpen:false;persist();render();break;
case 'toggle-unbound':ui.unbound=!ui.unbound;refreshMods();break;
case 'reset-filters':Object.assign(ui,{query:'',status:'all',updates:'all',source:'all',cat:'all',unbound:false});refreshMods();break;
case 'sort-name':ui.sort='name';refreshMods();break;
case 'select':{if(e?.shiftKey&&ui.lastSelection){const a=filtered().map(m=>m.id),start=a.indexOf(ui.lastSelection),end=a.indexOf(id);if(start>=0&&end>=0)a.slice(Math.min(start,end),Math.max(start,end)+1).forEach(v=>ui.selected.add(v))}else ui.selected.has(id)?ui.selected.delete(id):ui.selected.add(id);ui.lastSelection=id;refreshMods();break}
case 'select-all':{const matches=filtered().map(m=>m.id),all=matches.length&&matches.every(id=>ui.selected.has(id));matches.forEach(id=>all?ui.selected.delete(id):ui.selected.add(id));refreshMods();break}
case 'clear-selection':ui.selected.clear();refreshMods();break;
case 'toggle':{const stopped=toggleEnabled(id);const m=find(id);persist();toast(`「${m.name}」已${m.enabled?'启用':'禁用'}${stopped?'；'+stopped+' 个补丁已自动停用':''}`,'ok');refreshMods();break}
case 'inspect':inspect(id);break;
case 'close-inspector':clearInspector();break;
case 'pin':s.inspectorPin=!s.inspectorPin;persist();refreshMods();break;
case 'more-mod':openMenu(el,id);break;
case 'find-source':findSources([id]);break;
case 'bulk-find':findSources([...ui.selected]);break;
case 'bind':openDialog('bind',{ids:[id]});break;
case 'bind-github':openDialog('github',{id});break;
case 'bulk-bind':openDialog('bind',{ids:[...ui.selected]});break;
case 'source-to-bind':openDialog('bind',{ids:[id]});break;
case 'unbind':{const mod=find(id);if(!mod)return;mod.ws='';mod.suggestion=null;activity(`解除「${mod.name}」Workshop ID`);refreshMods();break}
case 'delete-one':openDialog('delete',{ids:[id]});break;
case 'bulk-delete':openDialog('delete',{ids:[...ui.selected]});break;
case 'bulk-enable':case 'bulk-disable':{let total=0;const on=act==='bulk-enable';ui.selected.forEach(id=>total+=toggleEnabled(id,on));persist();toast(`批量${on?'启用':'禁用'} ${ui.selected.size} 项${total?`；自动停用 ${total} 个补丁`:''}`);refreshMods();break}
case 'bulk-update':{const ids=[...ui.selected].filter(id=>find(id)?.latest);ids.forEach(updateOne);toast(`完成 ${ids.length} 个模拟更新`);break}
case 'update-one':updateOne(id);break;
case 'update-all':{const ids=s.mods.filter(m=>m.latest).map(m=>m.id);ids.forEach(updateOne);break}
case 'check-mods':toast(`模拟检查完成：${countUpdates()} 项存在可用更新。无真实 API 请求`,'ok');activity('手动进行模拟更新检测');break;
case 'check-app':toast('当前为独立 HTML 概念原型，不包含可更新的真实程序','');break;
case 'import':openDialog('import');break;
case 'path':openDialog('path');break;
case 'reset':openDialog('reset');break;
case 'toggle-patch':togglePatch(id);break;
case 'check-patch':checkPatch(id);break;
case 'expand-patch':ui.patchFocus=ui.patchFocus===id?null:id;render();break;
case 'scan-patches':{s.patches.forEach(p=>{p.checked='本次模拟文件规则检查 · 未验证游戏兼容'});activity('模拟检查补丁文件状态');toast('已检查演示规则；运行兼容性仍需实际测试');render();break}
case 'confirm-patch-range':openDialog('patch-range',{id});break;
case 'record-runtime':openDialog('runtime',{id,result:el.dataset.result});break;
case 'add-patch':openDialog('add-patch');break;
case 'download-one':startDownload(id);break;
case 'download-tab':ui.downloadTab=ui.downloadTab==='queue'?'history':'queue';render();break;
case 'pause-task':case 'resume-task':case 'cancel-task':case 'install-task':taskAction(act,id);break;
case 'feature-scroll':$('#resources-heading')?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'close-modal':closeDialog();break;
case 'confirm-modal':submitModal();break;
default:toast('该操作是原型入口，未连接真实程序','warn')}
}
function onClick(e){const target=e.target,actionEl=target.closest('[data-act]');if(actionEl){e.preventDefault();doAction(actionEl.dataset.act,actionEl.dataset.id||'',actionEl,e);return}
if(target.id==='modaloverlay'){closeDialog();return}
if(ui.menu&&!target.closest('.popupmenu'))closeMenu();
const page=target.closest('[data-page]');if(page){const shortcut=page.dataset.shortcut;if(shortcut==='unbound'){ui.unbound=true}if(shortcut==='enabled'){ui.status='on'}go(page.dataset.page);return}
const view=target.closest('[data-view]');if(view){s.view=view.dataset.view;persist();if(s.page==='mods')refreshMods();else render();return}
const filt=target.closest('[data-filter]');if(filt){ui[filt.dataset.filter]=filt.dataset.value;refreshMods();return}
const chip=target.closest('[data-removefilter]');if(chip){const f=chip.dataset.removefilter;if(f==='unbound')ui.unbound=false;else ui[f]='all';refreshMods();return}
const insTab=target.closest('[data-instab]');if(insTab){ui.insTab=insTab.dataset.instab;refreshMods();return}
const pf=target.closest('[data-pfilter]');if(pf){ui.patchFilter=pf.dataset.pfilter;render();return}
const ds=target.closest('[data-dsource]');if(ds){ui.downloadSource=ds.dataset.dsource;render();return}
const dc=target.closest('[data-dcat]');if(dc){ui.downloadCat=dc.dataset.dcat;render();return}
const th=target.closest('[data-settheme]');if(th){s.theme=th.dataset.settheme;persist();render();return}
const den=target.closest('[data-setdensity]');if(den){s.density=den.dataset.setdensity;persist();render();return}
const u=target.closest('[data-updatefocus]');if(u){ui.updateFocus=u.dataset.updatefocus;render();return}
const r=target.closest('[data-resource]');if(r){openDialog('resource',{id:r.dataset.resource});return}
const o=target.closest('[data-open-mod]');if(o){inspect(o.dataset.openMod);return}
const mod=target.closest('[data-mod]');if(mod){inspect(mod.dataset.mod);return}
}
document.addEventListener('click',onClick);
document.addEventListener('input',e=>{if(e.target.id==='modquery'){ui.query=e.target.value;renderModItems();renderDock()}if(e.target.id==='patchsearch'){ui.patchSearch=e.target.value;renderPatchResults()}if(e.target.id==='dlquery'){ui.downloadQuery=e.target.value;$('#catalogresults').innerHTML=catalogResults()}});
document.addEventListener('change',e=>{if(e.target.id==='modsort'){ui.sort=e.target.value;renderModItems()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal){closeDialog();return}if(ui.menu){closeMenu();return}if(s.page==='mods'&&ui.focus){clearInspector();return}if(ui.selected.size){ui.selected.clear();refreshMods()}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(s.page!=='mods')go('mods');$('#modquery')?.focus()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-mod]')){e.preventDefault();inspect(e.target.dataset.mod)}if(e.key==='Enter'&&e.target.matches('[data-resource]')){openDialog('resource',{id:e.target.dataset.resource})}});
window.addEventListener('resize',closeMenu);
if(s.page==='mods'&&innerWidth<1250)s.railOpen=false;
function applySnapshot(snapshot){if(!isHosted||!snapshot)return;s.mods=Array.isArray(snapshot.mods)?snapshot.mods:[];s.patches=Array.isArray(snapshot.patches)?snapshot.patches:[];s.gamePath=snapshot.gamePath||'';s.gameSelected=!!snapshot.gameSelected;s.gameRunning=!!snapshot.gameRunning;s.gameStatus=snapshot.gameStatus||'尚未定位游戏目录';s.inventoryIssueCount=Number(snapshot.inventoryIssueCount||0);s.scanIssueCount=Number(snapshot.scanIssueCount||0);s.scanTime=snapshot.scanTime||'';s.activities=[];if(ui.focus&&!find(ui.focus))ui.focus=null;ui.selected.clear();render()}
if(isHosted){window.chrome.webview.addEventListener('message',event=>{const message=event.data||{};if(message.type==='snapshot')applySnapshot(message.payload);else if(message.type==='toast')toast(message.message||'操作已完成',message.kind||'');else if(message.type==='refreshing')toast('正在读取本地游戏状态');});}
render();if(isHosted)sendHostMessage('ready');else if(s.downloads.some(t=>['queued','downloading'].includes(t.state)))startTimer();
})();
</script></body></html>
