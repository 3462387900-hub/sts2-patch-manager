name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.14.4 或 v0.14.4-beta.1'
        required: true
        type: string
      beta:
        description: '是否按测试版发布（版本号带预发布后缀时会自动按 Beta 处理）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# 发布流程串行执行，避免多个版本同时争抢稳定版或 Beta 更新索引。
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Normalize and validate release version
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BETA: ${{ inputs.beta }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:EVENT_NAME -eq 'push') {
            if ($env:REF_NAME -notmatch '^v(?<version>.+)$') {
              throw "Tag must start with v."
            }
            $rawVersion = $Matches.version
            $requestedBeta = $false
          }
          else {
            $rawVersion = ([string]$env:INPUT_VERSION).Trim()
            if ([string]::IsNullOrWhiteSpace($rawVersion)) {
              throw "请填写版本号。"
            }
            if ($rawVersion -match '^[vV]') {
              $rawVersion = $rawVersion.Substring(1)
            }
            $requestedBeta = [string]::Equals(
              $env:INPUT_BETA,
              'true',
              [System.StringComparison]::OrdinalIgnoreCase
            )
          }

          $versionMatch = [regex]::Match(
            $rawVersion,
            '^(?<base>(?:0|[1-9][0-9]*)[.](?:0|[1-9][0-9]*)[.](?:0|[1-9][0-9]*))(?<suffix>-beta[.](?<betaNumber>[1-9][0-9]{0,8}))?$'
          )
          if (!$versionMatch.Success) {
            throw "版本号格式不正确：$rawVersion。仅支持 0.14.4 或 0.14.4-beta.1；不支持 -rc、-preview 等其他后缀。"
          }

          $baseVersion = $versionMatch.Groups['base'].Value
          $suffix = $versionMatch.Groups['suffix'].Value
          $hasPrerelease = ![string]::IsNullOrEmpty($suffix)

          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $requestedBeta -and !$hasPrerelease) {
            throw "已勾选 Beta，但版本号没有 -beta.N 后缀。请使用例如 0.14.4-beta.1 的格式。"
          }

          # 任何 -beta.N 后缀都强制进入 prerelease 流程，不能误发到稳定版渠道。
          $isBeta = $hasPrerelease
          if ($isBeta -and !$requestedBeta -and $env:EVENT_NAME -eq 'workflow_dispatch') {
            Write-Warning "检测到 -beta.N 后缀；已自动忽略未勾选的 Beta 开关，强制按 Beta 发布。"
          }
          $channel = if ($isBeta) { 'Beta' } else { 'Stable' }
          $informationalVersion = $rawVersion

          $tag = "v$rawVersion"
          $notesPath = "releases/$tag.md"
          if (!(Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "找不到本版更新日志：$notesPath"
          }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesPath -Raw))) {
            throw "本版更新日志为空：$notesPath"
          }

          [xml]$project = Get-Content -LiteralPath 'SpirePatch.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $baseVersion) {
            throw "项目版本不匹配：SpirePatch.csproj 是 $projectVersion，发布版本要求 $baseVersion。"
          }
          $projectInformationalVersion = [string]$project.Project.PropertyGroup.InformationalVersion
          if ($projectInformationalVersion -cne $projectVersion) {
            throw "SpirePatch.csproj 的 InformationalVersion 必须与 Version 相同。当前 Version=$projectVersion，InformationalVersion=$projectInformationalVersion。Beta 后缀由打包脚本在编译时注入。"
          }

          $title = "尖塔修补站 $tag"
          if ($isBeta) {
            $title = "尖塔修补站 v$baseVersion Beta $($versionMatch.Groups['betaNumber'].Value)"
          }

          $assetName = "SpirePatch-$tag-win-x64.zip"
          @(
            "version=$baseVersion"
            "tag=$tag"
            "channel=$channel"
            "informational_version=$informationalVersion"
            "is_beta=$($isBeta.ToString().ToLowerInvariant())"
            "notes_path=$notesPath"
            "asset_name=$assetName"
            "title=$title"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Release tag: $tag"
          Write-Host "Project version: $baseVersion"
          Write-Host "Prerelease: $isBeta"
          Write-Host "Release notes: $notesPath"

      - name: Build and run isolated checks
        shell: pwsh
        env:
          RELEASE_INFORMATIONAL_VERSION: ${{ steps.meta.outputs.informational_version }}
        run: ./scripts/打包.ps1 -BuildOnly -OutputRoot artifacts -InformationalVersion $env:RELEASE_INFORMATIONAL_VERSION
      - name: Verify release index isolation and package notices
        shell: pwsh
        run: ./scripts/测试发布流程.ps1

      - name: Assemble self-contained release ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_NOTES: ${{ steps.meta.outputs.notes_path }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION

          $latestArtifact = Get-ChildItem -LiteralPath 'artifacts' -Directory |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $latestArtifact) {
            throw 'Build output directory is missing.'
          }

          $app = Join-Path $latestArtifact.FullName ('尖塔修补站-v' + $version)
          if (!(Test-Path -LiteralPath (Join-Path $app 'SpirePatch.exe'))) {
            throw 'Build output is missing SpirePatch.exe.'
          }

          Copy-Item README.md (Join-Path $app '使用说明.md')
          Copy-Item -LiteralPath 'docs/发布指南.md' -Destination (Join-Path $app '发布指南.md')
          Copy-Item -LiteralPath 'docs/补丁发布指南.md' -Destination (Join-Path $app '补丁发布指南.md')
          Copy-Item -LiteralPath $env:RELEASE_NOTES -Destination (Join-Path $app '本版更新内容.md')
          Copy-Item -LiteralPath '鸣谢与来源.md' -Destination (Join-Path $app '鸣谢与来源.md')
          Copy-Item -LiteralPath 'THIRD-PARTY-NOTICES.md' -Destination (Join-Path $app 'THIRD-PARTY-NOTICES.md')

          $thirdParty = Join-Path $app 'third_party'
          New-Item -ItemType Directory -Path $thirdParty -Force | Out-Null
          Copy-Item -LiteralPath 'third_party/WorkshopAndroidDownloader-LICENSE.txt' -Destination (Join-Path $thirdParty 'WorkshopAndroidDownloader-LICENSE.txt')
          Copy-Item -LiteralPath 'third_party/SharpCompress-LICENSE.txt' -Destination (Join-Path $thirdParty 'SharpCompress-LICENSE.txt')

          ./scripts/验证发布声明.ps1 -Directory $app -SourceRoot (Get-Location).Path
          ./scripts/生成程序清单.ps1 -Directory $app

          $dir = Join-Path (Get-Location) 'release-output'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $archive = Join-Path $dir $env:ASSET_NAME
          ./scripts/创建干净发布包.ps1 -ApplicationDirectory $app -ArchivePath $archive -Version $version
          ./scripts/验证发布声明.ps1 -Directory $app -SourceRoot (Get-Location).Path -ArchivePath $archive

          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $info = [ordered]@{
            version = $version
            file_name = [IO.Path]::GetFileName($archive)
            bytes = (Get-Item $archive).Length
            sha256 = $digest
          }
          $info | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dir '校验信息.json') -Encoding utf8

          if ((Get-Item $archive).Length -lt 1000000) {
            throw 'Release archive unexpectedly small.'
          }

      - name: Publish release on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          RELEASE_NOTES: ${{ steps.meta.outputs.notes_path }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          IS_BETA: ${{ steps.meta.outputs.is_beta }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:REPOSITORY
          $tag = $env:RELEASE_TAG

          $existing = gh release view $tag -R $repo --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "$tag already exists; refusing to replace published assets."
          }

          $archive = "release-output/$($env:ASSET_NAME)"
          if ($env:IS_BETA -eq 'true') {
            gh release create $tag -R $repo --target $env:TARGET_SHA --title $env:RELEASE_TITLE --notes-file $env:RELEASE_NOTES --prerelease --latest=false $archive 'release-output/校验信息.json'
          }
          else {
            gh release create $tag -R $repo --target $env:TARGET_SHA --title $env:RELEASE_TITLE --notes-file $env:RELEASE_NOTES --latest $archive 'release-output/校验信息.json'
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release creation failed.'
          }

          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not verify the created GitHub release.'
          }
          $asset = @($release.assets | Where-Object {
            $_.name -eq $env:ASSET_NAME -and $_.state -eq 'uploaded'
          })
          $expected = (Get-Content 'release-output/校验信息.json' -Raw | ConvertFrom-Json).sha256
          if ($asset.Count -ne 1 -or $asset[0].digest -ne ('sha256:' + $expected)) {
            throw 'Uploaded asset checksum mismatch.'
          }

      - name: Update selected manager index on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $indexFile = if ($env:RELEASE_CHANNEL -eq 'Beta') { 'manager-beta-update.json' } else { 'manager-update.json' }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not switch the worktree to origin/main.' }
          git branch --set-upstream-to=origin/main main
          if ($LASTEXITCODE -ne 0) { throw 'Could not set main tracking branch.' }
          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fast-forward local main.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          function New-IndexCommit {
            & ./scripts/更新版本索引.ps1 -Tag $env:RELEASE_TAG -Channel $env:RELEASE_CHANNEL | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Index generation failed.' }
            git add $indexFile | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Could not stage $indexFile." }
            git diff --cached --quiet
            $diffExit = $LASTEXITCODE
            if ($diffExit -eq 0) {
              Write-Host "$indexFile already points to this release; no commit is needed."
              return $false
            }
            if ($diffExit -ne 1) { throw "Could not inspect the staged $indexFile diff." }
            git commit -m "chore: update $indexFile for $env:RELEASE_TAG" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Index commit failed.' }
            return $true
          }

          function Sync-IndexWithOriginMain {
            git fetch origin main | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh origin/main before pushing the index.' }
            git rebase origin/main | Out-Host
            if ($LASTEXITCODE -eq 0) { return $true }
            git rebase --abort 2>$null | Out-Host
            git reset --hard origin/main | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Could not reset to the newest origin/main after a rebase conflict.' }
            return (New-IndexCommit)
          }

          $hasIndexCommit = New-IndexCommit
          if ($hasIndexCommit) {
            $hasIndexCommit = Sync-IndexWithOriginMain
            if ($hasIndexCommit) {
              git push origin HEAD:main | Out-Host
              if ($LASTEXITCODE -ne 0) {
                $hasIndexCommit = Sync-IndexWithOriginMain
                if ($hasIndexCommit) {
                  git push origin HEAD:main | Out-Host
                  if ($LASTEXITCODE -ne 0) { throw "Index push to main failed after retry ($indexFile)." }
                }
              }
            }
          }
