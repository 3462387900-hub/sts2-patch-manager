name: Publish v0.14.7 Beta 1 (tidy portable layout)
on:
  push:
    branches: [feature/atlas-wpf-native-ui]
    paths:
      - '.github/workflows/release-v0.14.7-beta.1.yml'
permissions:
  contents: write
concurrency:
  group: publish-v0.14.7-beta.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run isolated safety, WPF and release-layout checks
        shell: pwsh
        run: ./scripts/打包.ps1 -BuildOnly -OutputRoot artifacts
      - name: Assemble tidy portable release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath 'SpirePatch.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          $info = [string]$project.Project.PropertyGroup.InformationalVersion
          if ($version -ne '0.14.7' -or $info -ne '0.14.7-beta.1') {
            throw 'This workflow is exclusive to v0.14.7-beta.1.'
          }
          $build = Get-ChildItem -LiteralPath 'artifacts' -Directory |
            Where-Object { $_.Name -like '发布-*' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $build) { throw 'No verified Windows build output.' }
          $app = Join-Path $build.FullName ('尖塔修补站-v' + $version)
          if (!(Test-Path -LiteralPath (Join-Path $app 'SpirePatch.exe') -PathType Leaf)) {
            throw 'The verified Windows apphost is missing.'
          }
          Copy-Item README.md (Join-Path $app '使用说明.md')
          Copy-Item 发布指南.md (Join-Path $app '发布指南.md')
          Copy-Item 补丁发布指南.md (Join-Path $app '补丁发布指南.md')
          Copy-Item releases/v0.14.7-beta.1.md (Join-Path $app '本版更新内容.md')
          Copy-Item 鸣谢与来源.md (Join-Path $app '鸣谢与来源.md')
          Copy-Item THIRD-PARTY-NOTICES.md (Join-Path $app 'THIRD-PARTY-NOTICES.md')
          $thirdParty = Join-Path $app 'third_party'
          New-Item -ItemType Directory -Path $thirdParty -Force | Out-Null
          Copy-Item third_party/WorkshopAndroidDownloader-LICENSE.txt (Join-Path $thirdParty 'WorkshopAndroidDownloader-LICENSE.txt')
          Copy-Item third_party/SharpCompress-LICENSE.txt (Join-Path $thirdParty 'SharpCompress-LICENSE.txt')
          ./scripts/整理玩家发布目录.ps1 -ApplicationDirectory $app
          $shortcut = Join-Path $app '00-启动尖塔修补站.lnk'
          if (!(Test-Path -LiteralPath $shortcut -PathType Leaf)) {
            throw 'The Chinese Windows shortcut is missing.'
          }
          ./scripts/生成程序清单.ps1 -Directory $app
          $manifest = Get-Content -LiteralPath (Join-Path $app 'manager-files.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $managedPaths = @($manifest.Files.PSObject.Properties.Name)
          foreach ($required in @('SpirePatch.exe', '00-启动尖塔修补站.lnk', '使用说明/使用说明.md', '使用说明/本版更新内容.md')) {
            if ($managedPaths -notcontains $required) { throw ('Release manifest is missing: ' + $required) }
          }
          if ($managedPaths -contains '使用说明.md' -or $managedPaths -contains '00-启动尖塔修补站.exe') {
            throw 'The release still contains a root-level document or duplicate executable launcher.'
          }
          $dir = Join-Path (Get-Location) 'release-output'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $archive = Join-Path $dir 'SpirePatch-v0.14.7-beta.1-win-x64.zip'
          ./scripts/创建干净发布包.ps1 -ApplicationDirectory $app -ArchivePath $archive -Version $version
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = [ordered]@{
            version = $info
            file_name = [IO.Path]::GetFileName($archive)
            bytes = (Get-Item -LiteralPath $archive).Length
            sha256 = $digest
          }
          $record | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dir '校验信息.json') -Encoding utf8
          if ((Get-Item -LiteralPath $archive).Length -lt 1000000) {
            throw 'The Beta ZIP is unexpectedly small.'
          }
      - name: Publish GitHub Pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $tag = 'v0.14.7-beta.1'
          gh release view $tag -R $repo --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'The Beta tag already exists; refusing to replace a published release.'
          }
          gh release create $tag -R $repo --target '${{ github.sha }}' --title '尖塔修补站 v0.14.7 Beta 1 · 整洁发布目录' --notes-file releases/v0.14.7-beta.1.md --prerelease --latest=false 'release-output/SpirePatch-v0.14.7-beta.1-win-x64.zip' 'release-output/校验信息.json'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Beta release creation failed.' }
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read back the published Beta release.' }
          $asset = @($release.assets | Where-Object {
            $_.name -eq 'SpirePatch-v0.14.7-beta.1-win-x64.zip' -and $_.state -eq 'uploaded'
          })
          $expected = Get-Content -LiteralPath 'release-output/校验信息.json' -Raw | ConvertFrom-Json
          if ($release.draft -or !$release.prerelease -or $release.tag_name -ne $tag -or
              !$release.body -or $asset.Count -ne 1 -or
              $asset[0].digest -ne ('sha256:' + $expected.sha256) -or
              $asset[0].size -ne $expected.bytes) {
            throw 'Published Beta metadata, ZIP size, or SHA-256 does not match.'
          }
          Write-Output "Verified $tag and SHA-256 $($expected.sha256)."
      - name: Update only the Beta update feed on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $tag = 'v0.14.7-beta.1'
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the published Beta release.' }
          $asset = @($release.assets | Where-Object {
            $_.name -eq 'SpirePatch-v0.14.7-beta.1-win-x64.zip' -and $_.state -eq 'uploaded'
          })
          if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[a-fA-F0-9]{64}$') {
            throw 'The published Beta ZIP is missing its verified SHA-256 digest.'
          }
          $feed = [ordered]@{
            tag_name = $release.tag_name
            draft = $false
            prerelease = $true
            body = $release.body
            published_at = $release.published_at
            html_url = $release.html_url
            assets = @([ordered]@{
              name = $asset[0].name
              state = $asset[0].state
              size = $asset[0].size
              digest = $asset[0].digest
              browser_download_url = $asset[0].browser_download_url
              url = $asset[0].url
            })
          }
          $json = $feed | ConvertTo-Json -Depth 8
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $current = gh api "repos/$repo/contents/manager-beta-update.json?ref=main" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$current.sha) { throw 'Could not read the current Beta feed on main.' }
          gh api "repos/$repo/contents/manager-beta-update.json" -X PUT `
            -f "message=chore: update Beta feed to $tag" `
            -f "content=$encoded" `
            -f "sha=$($current.sha)" `
            -f "branch=main" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not update manager-beta-update.json on main.' }
          $after = gh api "repos/$repo/contents/manager-beta-update.json?ref=main" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the updated Beta feed.' }
          $afterJson = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($after.content -replace '\s','')))
          $afterFeed = $afterJson | ConvertFrom-Json
          if ($afterFeed.tag_name -ne $tag -or !$afterFeed.prerelease -or $afterFeed.assets[0].digest -ne $asset[0].digest) {
            throw 'The Beta feed on main does not match the published release.'
          }
          Write-Output "Updated manager-beta-update.json on main to $tag. Stable manager-update.json was not changed."
