name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test without touching a game
        shell: pwsh
        run: ./scripts/打包.ps1 -BuildOnly
      - name: Build standalone Supply Station probe
        shell: pwsh
        run: |
          [xml]$managerProject = Get-Content ./SpirePatch.csproj -Raw
          $managerVersion = [string]$managerProject.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($managerVersion)) { throw "SpirePatch.csproj is missing the manager Version." }
          dotnet publish ./tools/SupplyStationProbe/SupplyStationProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:Version=$managerVersion" -o ./artifacts/SpireSupplyStationProbe
          if ($LASTEXITCODE -ne 0) { throw "Standalone Supply Station probe publish failed." }
      - name: Verify release ZIP excludes runtime data
        shell: pwsh
        run: ./scripts/验证发布清理.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-build-and-checks
          path: artifacts/
